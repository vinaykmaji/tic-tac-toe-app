# you can find the deploy.yml file in the other folder named successfuldeployfile. named sucessfuldeployedfile.yml

name: Build,Analyze,scan

on:
  push:
    branches:
      - main


jobs:
  build-analyze-scan:
    name: Build
    runs-on: [Eks-githubactions-vin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Deploy to container
        run: |
          docker stop game  || true
          docker rm game || true

      - name: Update kubeconfig
        # run: aws eks --region eu-north-1 update-kubeconfig --name vin-eks-cluster
        run: |
            aws eks --region  eu-north-1 update-kubeconfig --name vin-eks-cluster --kubeconfig $HOME/.kube/config
            echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
    
      - name: Deploy to kubernetes
        run: kubectl delete -f deployment-service.yml --ignore-not-found
  
      - name: Send a Slack Notification
        if: always()
        uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#githubactionskunal-eks'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
