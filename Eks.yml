name: Build,Analyze,scan

on:
  push:
    branches:
      - main


env:
  AWS_REGION: ap-north-1
  ECR_REPO: tic-tac-toe-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-analyze-scan:
    name: Build
    runs-on: [self-hosted, linux, aws]    
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # with:
        #   fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # - name: Build and analyze with SonarQube
      #   uses: sonarsource/sonarqube-scan-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      
      # - name: npm install dependency
      #   run: npm install

      # - name: Trivy file scan
      #   run: trivy fs . > trivyfs.txt

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Build
        run: docker build -t ${{ steps.meta.outputs.image }} .

      # - name: Trivy scan (fail on HIGH/CRITICAL)
      #   run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed ${{ steps.meta.outputs.image }}

      - name: Push
        run: docker push ${{ steps.meta.outputs.image }}
        
      # - name: Docker Build and push
      #   run: |
      #     docker build -t tic-tac-toe .
      #     # docker tag tic-tac-toe sevenajay/tic-tac-toe:latest
      #     docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
      #     docker push sevenajay/tic-tac-toe:latest
      #   env:
      #     DOCKER_CLI_ACI: 1

      # - name: Image scan
      #   run: trivy image sevenajay/tic-tac-toe:latest > trivyimage.txt
      

  deploy:
   needs: build-analyze-scan   
   runs-on: [self-hosted]
   steps:
      - uses: actions/checkout@v4
     
      # - name: docker pull image
      #   run: docker pull sevenajay/tic-tac-toe:latest

      # - name: Image scan
      #   run: trivy image sevenajay/tic-tac-toe:latest > trivyimagedeploy.txt  
  
      # - name: Deploy to container
      #   run: docker run -d --name game -p 3000:3000 sevenajay/tic-tac-toe:latest

      - name: Update kubeconfig
        run: aws eks --region ${{ env.AWS_REGION }} update-kubeconfig --name vin-eks-cluster  

      - name: Deploy to kubernetes
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ needs.build-scan-push.outputs.image }}|" deployment-service.yml
          kubectl apply -f deployment-service.yml
          kubectl rollout status deployment/tic-tac-toe --timeout=120s
  
      - name: Send a Slack Notification
        if: always()
        uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#githubactions-eks'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  

        
